<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MithraQ — Together We Grow</title>
  <link rel="stylesheet" href="style.css?v=20260911-phase16-blankfix">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/mithra-icon-192.png">
  <link rel="apple-touch-icon" href="assets/mithra-icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b7055">
</head>
<body>
  <div id="offlineBanner" class="offline-banner hidden">📴 You are offline. Changes will stay on this device until you reconnect.</div>
  <div id="installPrompt" class="install-prompt hidden"><div><b>Install MithraQ</b><span>Get faster access and an app-like experience.</span></div><button class="btn gold" id="installBtn">Install</button><button class="install-close" id="installClose" aria-label="Close">×</button></div>
  <div class="app">
    <div id="authRoot"></div>
    <header class="topbar">
      <div class="brand-mark" aria-label="MithraQ logo"></div>
      <div class="topbar-title">
        <h1>MithraQ</h1>
        <p>Chit • Members • Auction • Reports • Role Access</p>
      </div>
    </header>
    <main id="app" class="content"></main>
    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-head"><h3 id="modalTitle">Add</h3><button class="modal-close" onclick="closeModal()">×</button></div>
        <div id="modalBody"></div>
      </div>
    </div>
    <div id="menuSheet" class="menu-sheet hidden" onclick="if(event.target===this)closeMenuSheet()">
      <div class="menu-sheet-card">
        <div class="menu-sheet-handle"></div>
        <div class="menu-sheet-grid">
          <button onclick="tab='members';render();closeMenuSheet()"><span class="menu-sheet-icon mi-blue">♙</span><span>Members</span></button>
          <button onclick="tab='reports';render();closeMenuSheet()"><span class="menu-sheet-icon mi-green">▤</span><span>Reports</span></button>
          <button onclick="tab='search';render();closeMenuSheet()"><span class="menu-sheet-icon mi-gold">⌕</span><span>Search</span></button>
          <button onclick="tab='settings';render();closeMenuSheet()"><span class="menu-sheet-icon mi-grey">⚙</span><span>Settings</span></button>
          <button type="button" onclick="openHistory()"><span class="menu-sheet-icon mi-history">◷</span><span>History</span></button>
        </div>
      </div>
    </div>
    <nav class="bottom-nav">
      <button data-tab="home" class="nav-item active"><span class="nav-icon">⌂</span><span class="nav-label">Home</span></button>
      <button data-tab="chits" class="nav-item"><span class="nav-icon">▣</span><span class="nav-label">Chits</span></button>
      <button class="nav-item nav-menu" id="navMenuBtn" onclick="openMenuSheet()"><span class="nav-menu-circle">☰</span><span class="nav-label menu-label">Menu</span></button>
      <button data-tab="auction" class="nav-item"><span class="nav-icon">♢</span><span class="nav-label">Auction</span></button>
      <button data-tab="collection" class="nav-item"><span class="nav-icon">₹</span><span class="nav-label">Collection</span></button>
    </nav>
  </div>

  <script>
  // Emergency boot guard: never leave the main area blank.
  (function(){
    var app=document.getElementById('app');
    function fallback(){
      if(!app || app.children.length) return;
      app.innerHTML='<div style="padding:26px 22px"><h2 style="margin:0 0 6px;color:#056b4f;font-family:serif">Welcome to MithraQ</h2><p style="color:#74837f;margin:0 0 18px">Smart Chit Management</p><div style="background:#056b4f;color:white;border-radius:22px;padding:22px;margin-bottom:14px"><small style="font-weight:700;letter-spacing:1px">DASHBOARD READY</small><h2 style="margin:10px 0 0">₹0</h2><p style="margin:8px 0 0;opacity:.85">Your app is loading safely.</p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div style="background:white;border-radius:16px;padding:18px;border:1px solid #dbe8e1"><small>ACTIVE CHITS</small><h2 style="margin:8px 0 0;color:#056b4f">0</h2></div><div style="background:white;border-radius:16px;padding:18px;border:1px solid #dbe8e1"><small>MEMBERS</small><h2 style="margin:8px 0 0;color:#056b4f">0</h2></div></div></div>';
    }
    fallback();
    setTimeout(fallback,1200);
    setTimeout(fallback,3000);
    // Remove stale service workers/caches from earlier broken PWA builds.
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister();});}).catch(function(){});}
    if(window.caches){caches.keys().then(function(keys){keys.filter(function(k){return k.indexOf('mithraq')===0;}).forEach(function(k){caches.delete(k);});}).catch(function(){});}
  })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js?v=20260911-phase16-blankfix"></script>
</body>
</html>
